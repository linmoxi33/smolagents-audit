[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolagents-audit"
version = "0.1.0"
description = "Verify what smolagents actually does, not what its README says."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "linmoxi33" }]
keywords = ["smolagents", "audit", "sandbox", "verification", "llm-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = ["smolagents>=1.26.0"]

[project.optional-dependencies]
# 被核验的「授权第三方库」场景需要这两个
libs = ["pandas", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
smolagents-audit = "smolagents_audit.cli:main"

[tool.setuptools.packages.find]
include = ["smolagents_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
